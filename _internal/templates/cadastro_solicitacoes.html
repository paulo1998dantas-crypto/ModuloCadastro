<!DOCTYPE html>
<html lang="pt-BR">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Solicitações de cadastro | JI</title>
<style>
body{font:14px Arial,sans-serif;background:#f1f5f9;color:#13243e;margin:0}header{background:#10213d;color:white;padding:22px 28px}header h1{margin:0 0 12px}a{color:inherit}main{padding:24px}.toolbar,.actions{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin:14px 0}input,select,textarea,button{font:inherit;padding:10px;border:1px solid #cbd5e1;border-radius:6px}button{cursor:pointer;background:#fff;color:#13243e}button.primary{background:#087f74;color:white}button:disabled{opacity:.5;cursor:wait}input{min-width:240px}textarea{width:calc(100% - 24px);resize:vertical}table{border-collapse:collapse;width:100%;background:white}th,td{padding:10px;text-align:left;border-bottom:1px solid #e2e8f0;vertical-align:top}th{background:#e2e8f0;font-size:12px}small{display:block;margin-top:6px;color:#475569}.wrap{overflow-x:auto}.spec{white-space:pre-wrap;overflow-wrap:anywhere;max-width:420px;min-width:140px}.badge{padding:4px 6px;border-radius:4px;background:#dbeafe;white-space:nowrap}.badge.closed{background:#d1fae5}.badge.cancelled{background:#ffe4e6}.hint{color:#475569}.error{padding:12px;background:#ffe4e6;color:#9f1239}dialog{border:0;border-radius:10px;width:min(850px,90vw);max-height:88vh;overflow:auto;box-shadow:0 16px 60px #0005}dialog::backdrop{background:#10213d99}.event{padding:14px;margin:10px 0;background:#f1f5f9}.event p{margin:8px 0}.split{display:grid;grid-template-columns:1fr 1fr;gap:16px}@media(max-width:700px){main{padding:12px}.split{display:block}input{min-width:0}}
</style></head>
<body>{% include "_portal_back.html" %}
<header><h1>Solicitações de cadastro</h1><a href="/cadastros">Cadastros</a> · <a href="/cadastros/auditoria">Rastreabilidade</a> · <a href="/suprimentos">Pessoas / Suprimentos</a></header>
<main><p class="hint">Solicitações vindas do Comercial. A conclusão exige um SKU ativo ou uma devolutiva. Nenhuma solicitação altera automaticamente cadastros, preços ou B.O.M.</p>
<div class="toolbar"><input id="q" placeholder="SKU, especificação ou solicitante"><select id="status"><option value="">Todos os status</option><option>SOLICITADA</option><option>EM ANÁLISE</option><option>CONCLUÍDA</option><option>CANCELADA</option></select><button id="filter">Filtrar / atualizar</button><strong id="count"></strong></div>
<p id="error" role="alert" class="error" hidden></p><div id="rows" class="wrap"></div><div class="toolbar"><button id="prev">← Anterior</button><span id="page"></span><button id="next">Próxima →</button></div></main>
<dialog id="detail"><div class="actions"><h2 id="title"></h2><button id="close">Fechar</button></div><div id="body"></div></dialog>
<script>
'use strict';
const canWrite={{ can_write|tojson }},csrf={{ workflow_csrf|tojson }};
const el=id=>document.getElementById(id),esc=value=>String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const date=value=>value?new Date(value).toLocaleString('pt-BR',{timeZone:'America/Sao_Paulo'}):'—';
const badge=value=>'<span class="badge '+(value==='CONCLUÍDA'?'closed':value==='CANCELADA'?'cancelled':'')+'">'+esc(value)+'</span>';
let currentPage=1,currentRecord=null,loadSequence=0;
async function api(path,body){const response=await fetch('/api/cadastro/solicitacoes'+path,{method:body?'POST':'GET',headers:body?{'Content-Type':'application/json','X-Cadastro-CSRF':csrf}:{},body:body?JSON.stringify(body):undefined});let data;try{data=await response.json()}catch{throw Error('Servidor indisponível ou sessão encerrada. Atualize a tela.')}if(!response.ok)throw Error(data.error||'Não foi possível concluir.');return data}
async function perform(fn){el('error').hidden=true;try{await fn()}catch(e){el('error').textContent=e.message;el('error').hidden=false;}}
async function load(){const seq=++loadSequence;const data=await api('?'+new URLSearchParams({q:el('q').value,status:el('status').value,page:currentPage}));if(seq!==loadSequence)return;
el('rows').innerHTML='<table><thead><tr>'+['Solicitação / tipo','SKU / especificação','Status','Solicitante / criação','Atendimento','Retorno / conclusão','Ações'].map(s=>'<th>'+s+'</th>').join('')+'</tr></thead><tbody>'+data.rows.map(r=>'<tr><td><strong>'+esc(r.id.slice(0,8).toUpperCase())+'</strong><small>'+esc(r.request_type)+'</small></td><td><strong>'+esc(r.sku||'Novo cadastro')+'</strong><small>'+esc(r.description)+'</small><p class="spec">'+esc(r.specification)+'</p></td><td>'+badge(r.status)+'</td><td>'+esc(r.created_by)+'<small>'+date(r.created_at)+'</small></td><td>'+esc(r.assigned_to||'—')+'<small>'+date(r.assigned_at)+'</small></td><td><strong>'+esc(r.result_sku||'—')+'</strong><p class="spec">'+esc(r.response)+'</p><small>'+date(r.completed_at)+'</small></td><td><button data-id="'+esc(r.id)+'">Abrir / histórico</button></td></tr>').join('')+(data.rows.length?'':'<tr><td colspan="7">Nenhuma solicitação encontrada.</td></tr>')+'</tbody></table>';
el('prev').disabled=currentPage===1;el('next').disabled=!data.has_next;el('page').textContent='Página '+currentPage;
document.querySelectorAll('[data-id]').forEach(b=>b.onclick=()=>perform(()=>open(b.dataset.id)));
const counts=await api('/notificacoes');el('count').textContent=counts.pending+(counts.capped?'+':'')+' pendentes';}
async function open(id){const r=await api('/'+id);currentRecord=r;el('title').textContent='Solicitação '+r.id.slice(0,8).toUpperCase();el('body').innerHTML='<p>'+badge(r.status)+' · '+esc(r.request_type)+'</p><h3>Especificação original</h3><p class="spec">'+esc(r.specification)+'</p><p>'+esc(r.sku||'Novo cadastro')+' · '+esc(r.description)+'</p><p>Solicitado por '+esc(r.created_by)+' em '+date(r.created_at)+'</p><h3>Retorno</h3><p><strong>'+esc(r.result_sku||'Sem código alocado')+'</strong></p><p class="spec">'+esc(r.response||'Aguardando atendimento.')+'</p>'+
(canWrite&&['SOLICITADA','EM ANÁLISE'].includes(r.status)?'<form id="response-form"><div class="split"><label>SKU ativo de retorno (opcional)<input id="result-sku" maxlength="80" placeholder="Código cadastrado / revisado"></label><p class="hint">Ou informe uma devolutiva para concluir. O SKU é validado no Cadastro. A especificação original é preservada.</p></div><label>Devolutiva<textarea id="response" maxlength="6000" rows="4"></textarea></label><div class="actions">'+(r.status==='SOLICITADA'?'<button id="claim" type="button">Assumir solicitação</button>':'')+'<button class="primary">Responder e concluir</button></div><p id="dialog-error" role="alert" class="error" hidden></p></form>':'')+
'<h3>Rastreabilidade completa</h3>'+r.events.map(e=>'<article class="event"><strong>'+esc(e.action)+'</strong> · '+esc(e.actor)+' · '+date(e.created_at)+'<p>Status: '+esc(e.before?.status||'—')+' → '+esc(e.after?.status)+'</p>'+(e.after?.result_sku?'<p>SKU de retorno: '+esc(e.after.result_sku)+'</p>':'')+(e.after?.response?'<p class="spec">'+esc(e.after.response)+'</p>':'')+'</article>').join('');
if(!el('detail').open)el('detail').showModal();if(el('claim'))el('claim').onclick=()=>submit('ASSUMIR');if(el('response-form'))el('response-form').onsubmit=e=>{e.preventDefault();submit('RESPONDER')};}
async function submit(action){const form=el('response-form'),error=el('dialog-error'),id=currentRecord.id;
const body={version:currentRecord.version,action,response:el('response').value,sku:el('result-sku').value};
if(action==='RESPONDER'&&!body.response.trim()&&!body.sku.trim()){error.textContent='Informe uma devolutiva ou um SKU.';error.hidden=false;return;}
form.querySelectorAll('button').forEach(b=>b.disabled=true);error.hidden=true;
try{await api('/'+id+'/responder',body);await open(id);await load();}catch(e){error.textContent=e.message;error.hidden=false;form.querySelectorAll('button').forEach(b=>b.disabled=false);}}
el('close').onclick=()=>el('detail').close();el('filter').onclick=()=>perform(async()=>{currentPage=1;await load()});el('q').onkeydown=e=>{if(e.key==='Enter')el('filter').click()};
el('prev').onclick=()=>perform(async()=>{currentPage--;await load()});el('next').onclick=()=>perform(async()=>{currentPage++;await load()});perform(load);
setInterval(()=>{if(document.visibilityState==='visible'&&!el('detail').open)perform(load)},30000);
</script></body></html>
