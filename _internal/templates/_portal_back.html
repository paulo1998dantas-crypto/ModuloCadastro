<style>
  .ji-portal-back{position:fixed;top:50%;left:0;z-index:80;display:grid;width:22px;height:40px;place-items:center;border:1px solid rgba(125,211,252,.45);border-left:0;border-radius:0 8px 8px 0;background:rgba(15,23,42,.72);color:#fff;box-shadow:0 3px 10px rgba(15,23,42,.14);opacity:.38;text-decoration:none;transform:translateY(-50%);transition:opacity .18s ease,background-color .18s ease,transform .18s ease;backdrop-filter:blur(4px)}
  .ji-portal-back:hover,.ji-portal-back:focus-visible{background:#0f766e;color:#fff;opacity:1;transform:translate(2px,-50%);outline:2px solid rgba(45,212,191,.25);outline-offset:1px}
  .ji-portal-back__arrow{font:700 16px/1 Arial,sans-serif}
  .ji-portal-back__label{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);clip-path:inset(50%);white-space:nowrap}
  @media print{.ji-portal-back{display:none!important}}
</style>
<a class="ji-portal-back" href="https://ji-portal-operacional.onrender.com/" aria-label="Voltar ao Portal JI" title="Voltar ao Portal JI"><span class="ji-portal-back__arrow" aria-hidden="true">←</span><span class="ji-portal-back__label">Portal JI</span></a>
{% if request is defined and request.state is defined and (request.state.cadastro_can_write or request.state.cadastro_is_comercial) %}
<style>.ji-cadastro-requests{position:fixed;right:16px;bottom:16px;z-index:90;background:#0f766e;color:white;padding:12px 16px;border-radius:9px;font:700 13px Arial;text-decoration:none;box-shadow:0 3px 12px #0003}@media print{.ji-cadastro-requests{display:none!important}}</style>
<a class="ji-cadastro-requests" href="/cadastros/solicitacoes">Solicitações de cadastro <span id="ji-cadastro-request-count"></span></a>
<script>
(function(){async function update(){if(document.visibilityState!=='visible')return;try{const r=await fetch('/api/cadastro/solicitacoes/notificacoes');if(!r.ok)return;const data=await r.json();document.getElementById('ji-cadastro-request-count').textContent=data.pending?'('+data.pending+(data.capped?'+':'')+')':'';}catch{}}update();setInterval(update,30000);})();
</script>
{% endif %}
